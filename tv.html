<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>TV</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; cursor:none; }
  .camada { position:absolute; left:0; top:0; width:100%; height:100%; background:#000; opacity:0; transition:opacity .8s; }
  .camada.on { opacity:1; }
  .camada img, .camada video { width:100%; height:100%; object-fit:contain; display:block; background:#000; }
  #aviso { position:absolute; left:0; top:0; width:100%; height:100%; display:none; color:#d9a84e; font-family:Arial,sans-serif; text-align:center; background:#1b0e0f; }
  #aviso div { position:absolute; top:50%; left:0; width:100%; margin-top:-40px; font-size:28px; line-height:1.5; }
  #aviso small { color:#8a6a5a; font-size:18px; }
</style>
</head>
<body>
<div class="camada" id="c0"></div>
<div class="camada" id="c1"></div>
<div id="aviso"><div id="avisoTxt"></div></div>
<script src="config.js"></script>
<script>
(function () {
  var CFG = window.CONFIG;
  var tvId = null;
  var m = /[?&]tv=([a-z0-9-]+)/.exec(location.search) || /#tv-([a-z0-9-]+)/.exec(location.hash);
  if (m) tvId = m[1];

  var aviso = document.getElementById('aviso');
  var avisoTxt = document.getElementById('avisoTxt');
  var camadas = [document.getElementById('c0'), document.getElementById('c1')];
  var frente = 0;            // índice da camada visível
  var lista = [];            // playlist atual
  var assinatura = '';       // JSON da playlist para detectar mudanças
  var pos = -1;              // posição atual
  var timer = null;
  var geracao = 0;           // invalida callbacks antigos
  var tocandoAgora = '';

  function mostrarAviso(t, sub) {
    avisoTxt.innerHTML = t + (sub ? '<br><small>' + sub + '</small>' : '');
    aviso.style.display = 'block';
  }
  function esconderAviso() { aviso.style.display = 'none'; }

  function url(path) {
    var partes = String(path).split('/');
    for (var i = 0; i < partes.length; i++) partes[i] = encodeURIComponent(partes[i]);
    return CFG.URL + '/storage/v1/object/public/' + CFG.BUCKET + '/' + partes.join('/');
  }

  function rpc(nome, corpo, ok, falha) {
    var x = new XMLHttpRequest();
    x.open('POST', CFG.URL + '/rest/v1/rpc/' + nome, true);
    x.setRequestHeader('apikey', CFG.KEY);
    x.setRequestHeader('Content-Type', 'application/json');
    x.timeout = 20000;
    x.onload = function () {
      if (x.status >= 200 && x.status < 300) {
        var d = null;
        try { d = x.responseText ? JSON.parse(x.responseText) : null; } catch (e) {}
        if (ok) ok(d);
      } else if (falha) falha();
    };
    x.onerror = function () { if (falha) falha(); };
    x.ontimeout = function () { if (falha) falha(); };
    x.send(JSON.stringify(corpo));
  }

  // ---------- cache: cada arquivo é baixado uma única vez ----------
  var VERSAO = 'tv-2 cache';
  var est = { baixados: 0, doCache: 0, memoria: 0, via: 'nenhum', bytes: 0 };
  var memoria = {};     // path -> endereço local (blob)
  var pendentes = {};   // path -> funções esperando o download
  function obter(path, cb) {
    if (memoria[path]) { est.memoria++; cb(memoria[path]); return; }
    if (pendentes[path]) { pendentes[path].push(cb); return; }
    pendentes[path] = [cb];
    var u = url(path);
    function fim(src) {
      var fila = pendentes[path] || []; delete pendentes[path];
      for (var i = 0; i < fila.length; i++) fila[i](src);
    }
    function guardar(blob) { est.bytes += blob.size || 0; memoria[path] = URL.createObjectURL(blob); fim(memoria[path]); }
    function viaXhr() {
      try {
        var x = new XMLHttpRequest();
        x.open('GET', u, true); x.responseType = 'blob';
        x.onload = function () { if (x.status >= 200 && x.status < 300 && x.response) { est.via = 'xhr'; est.baixados++; guardar(x.response); } else fim(u); };
        x.onerror = function () { fim(u); };
        x.send();
      } catch (e) { fim(u); }
    }
    if (window.caches && window.fetch && window.Promise) {
      caches.open('midia-v1').then(function (c) {
        est.via = 'cache-api';
        return c.match(u).then(function (r) {
          if (r) { est.doCache++; return r; }
          return fetch(u).then(function (resp) {
            if (!resp.ok) throw new Error('http');
            est.baixados++;
            return c.put(u, resp.clone()).then(function () { return resp; });
          });
        });
      }).then(function (resp) { return resp.blob(); }).then(guardar).catch(viaXhr);
    } else viaXhr();
  }
  function limpar() {
    var validos = {}, i;
    for (i = 0; i < lista.length; i++) validos[lista[i].path] = 1;
    for (var k in memoria) { if (!validos[k]) { try { URL.revokeObjectURL(memoria[k]); } catch (e) {} delete memoria[k]; } }
    if (window.caches && window.Promise) {
      caches.open('midia-v1').then(function (c) {
        return c.keys().then(function (ks) {
          ks.forEach(function (r) {
            var manter = false;
            for (var p in validos) { if (r.url === url(p)) manter = true; }
            if (!manter) c['delete'](r);
          });
        });
      })['catch'](function () {});
    }
  }
  function baixarTudo() {
    var fila = [], i;
    for (i = 0; i < lista.length; i++) fila.push(lista[i].path);
    (function prox() { if (!fila.length) return; obter(fila.shift(), prox); })();
  }

  // ---------- reprodução ----------
  function limpaTimer() { if (timer) { clearTimeout(timer); timer = null; } }

  function proximo() {
    if (!lista.length) { mostrarVazio(); return; }
    pos = (pos + 1) % lista.length;
    tocar(pos);
  }

  function mostrarVazio() {
    geracao++;
    limpaTimer();
    camadas[0].className = 'camada';
    camadas[1].className = 'camada';
    camadas[0].innerHTML = ''; camadas[1].innerHTML = '';
    mostrarAviso('Sem campanha para esta TV', tvId ? tvId : 'TV não identificada');
    tocandoAgora = '';
  }

  function tocar(i) {
    limpaTimer();
    var meu = ++geracao;
    var item = lista[i];
    if (!item) { proximo(); return; }
    var atras = 1 - frente;
    var cam = camadas[atras];
    cam.innerHTML = '';
    var el, pronto = false, seguiu = false;

    function exibir() {
      if (pronto || meu !== geracao) return;
      pronto = true;
      esconderAviso();
      cam.className = 'camada on';
      camadas[frente].className = 'camada';
      var antiga = camadas[frente];
      frente = atras;
      setTimeout(function () { if (antiga !== camadas[frente]) antiga.innerHTML = ''; }, 1000);
      tocandoAgora = item.campanha || '';
      if (lista.length > 1) obter(lista[(i + 1) % lista.length].path, function () {});
      var dur = parseInt(item.dur, 10) || 10;
      if (item.tipo === 'video') {
        try { var p = el.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
        if (lista.length === 1) { el.loop = true; return; }
        timer = setTimeout(avancar, (dur + 6) * 1000); // segurança
      } else {
        if (lista.length === 1) return;
        timer = setTimeout(avancar, dur * 1000);
      }
    }
    function avancar() {
      if (seguiu || meu !== geracao) return;
      seguiu = true;
      proximo();
    }
    function falhou() {
      if (meu !== geracao) return;
      timer = setTimeout(avancar, 2000);
    }

    if (item.tipo === 'video') {
      el = document.createElement('video');
      el.muted = true; el.defaultMuted = true;
      el.setAttribute('muted', ''); el.setAttribute('playsinline', ''); el.setAttribute('webkit-playsinline', '');
      el.preload = 'auto';
      el.oncanplay = exibir;
      el.onended = avancar;
      el.onerror = falhou;
      cam.appendChild(el);
      obter(item.path, function (src) { if (meu !== geracao) return; el.src = src; try { el.load(); } catch (e) {} });
      setTimeout(function () { if (!pronto && meu === geracao) { exibir(); } }, 15000);
    } else {
      el = document.createElement('img');
      el.onload = exibir;
      el.onerror = falhou;
      cam.appendChild(el);
      obter(item.path, function (src) { if (meu !== geracao) return; el.src = src; });
      setTimeout(function () { if (!pronto && meu === geracao) { falhou(); } }, 15000);
    }
  }

  // ---------- atualização da playlist ----------
  function aplicar(nova) {
    var ass = JSON.stringify(nova);
    if (ass === assinatura) return;
    assinatura = ass;
    try { localStorage.setItem('pl-' + tvId, ass); } catch (e) {}
    lista = nova;
    pos = -1;
    limpar();
    baixarTudo();
    if (!lista.length) { mostrarVazio(); return; }
    proximo();
  }

  function buscar() {
    if (!tvId) return;
    rpc('playlist', { p_tv: tvId }, function (d) {
      if (d && d.length !== undefined) aplicar(d);
    }, function () { /* sem rede: mantém o que está tocando */ });
  }

  function batimento() {
    if (!tvId) return;
    rpc('bater', { p_tv: tvId, p_tocando: tocandoAgora }, null, null);
  }

  // ---------- tela sempre ligada ----------
  function travaTela() {
    try {
      if (navigator.wakeLock && navigator.wakeLock.request) {
        navigator.wakeLock.request('screen').catch(function () {});
      }
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) travaTela(); });

  // ---------- tela cheia (precisa de um OK/clique no controle remoto) ----------
  function telaCheia() {
    var d = document.documentElement;
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) return;
      var f = d.requestFullscreen || d.webkitRequestFullscreen || d.mozRequestFullScreen || d.msRequestFullscreen;
      if (f) { var p = f.call(d); if (p && p.catch) p.catch(function () {}); }
    } catch (e) {}
  }
  document.addEventListener('click', telaCheia);
  document.addEventListener('keydown', telaCheia);

  // ---------- diagnóstico: abra o link com &debug=1 ----------
  if (/[?&]debug=1/.test(location.search)) {
    var dbg = document.createElement('div');
    dbg.style.cssText = 'position:fixed;left:10px;bottom:10px;z-index:99;background:rgba(0,0,0,.8);color:#d9a84e;font:20px Arial;padding:10px 14px;border-radius:8px;line-height:1.4';
    document.body.appendChild(dbg);
    setInterval(function () {
      dbg.innerHTML = VERSAO + '<br>Cache API: ' + (window.caches ? 'sim' : 'NAO') + ' (' + est.via + ')' +
        '<br>Baixados da internet: ' + est.baixados + ' (' + (est.bytes / 1048576).toFixed(1) + ' MB)' +
        '<br>Vindos do cache: ' + est.doCache + ' | da memoria: ' + est.memoria +
        '<br>Arquivos na lista: ' + lista.length;
    }, 1000);
  }

  // ---------- início ----------
  if (!tvId) {
    mostrarAviso('TV não identificada', 'Abra o link no formato tv.html?tv=eventos-1-a');
    return;
  }
  // mostra a última playlist conhecida enquanto a rede responde
  try {
    var guardada = localStorage.getItem('pl-' + tvId);
    if (guardada) { assinatura = guardada; lista = JSON.parse(guardada); if (lista.length) proximo(); }
  } catch (e) {}
  if (!lista.length) mostrarAviso('Carregando...', tvId);
  travaTela();
  buscar();
  batimento();
  setInterval(buscar, 60 * 1000);
  setInterval(batimento, 2 * 60 * 1000);
  // recarrega a página 1x por dia (limpa memória do navegador da TV)
  setTimeout(function () { location.reload(); }, 24 * 60 * 60 * 1000);
})();
</script>
</body>
</html>
