<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Diagnóstico da TV</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin:0; padding:30px 50px; background:#1b0e0f; color:#f3e7d8; font-family:Arial,sans-serif; font-size:26px; line-height:1.5; }
  h1 { color:#d9a84e; font-size:34px; margin:0 0 20px; }
  .l { padding:6px 0; border-bottom:1px solid #4a2a2e; }
  .k { color:#a58e80; display:inline-block; width:430px; }
  .s { color:#5fbf7a; font-weight:bold; } .n { color:#e08a85; font-weight:bold; }
  .ua { font-size:20px; color:#d9a84e; word-break:break-all; margin-top:18px; }
</style>
</head>
<body>
<h1>Diagnóstico da TV</h1>
<div id="out"></div>
<div class="ua" id="ua"></div>
<script>
(function () {
  var out = document.getElementById('out');
  function linha(nome, ok, extra) {
    var d = document.createElement('div'); d.className = 'l';
    d.innerHTML = '<span class="k">' + nome + '</span><span class="' + (ok ? 's' : 'n') + '">' + (ok ? 'SIM' : 'NÃO') + '</span>' + (extra ? ' <small>' + extra + '</small>' : '');
    out.appendChild(d);
  }
  function t(fn) { try { return !!fn(); } catch (e) { return false; } }
  var v = document.createElement('video');
  var h264 = '';
  try { h264 = v.canPlayType('video/mp4; codecs="avc1.640028"'); } catch (e) {}
  linha('Vídeo H.264 (mp4)', !!h264, h264);
  linha('Receber vídeo ao vivo (WebRTC)', t(function () { return window.RTCPeerConnection || window.webkitRTCPeerConnection; }));
  linha('Tela cheia pelo site', t(function () { var d = document.documentElement; return d.requestFullscreen || d.webkitRequestFullscreen; }));
  linha('Tela sempre ligada (Wake Lock)', t(function () { return navigator.wakeLock; }));
  linha('Conexão em tempo real (WebSocket)', t(function () { return window.WebSocket; }));
  linha('Guardar dados (localStorage)', t(function () { localStorage.setItem('x', '1'); return localStorage.getItem('x') === '1'; }));
  linha('MediaSource (vídeo por partes)', t(function () { return window.MediaSource; }));
  linha('Memória do navegador', t(function () { return navigator.deviceMemory; }), navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'não informa');
  var el = document.createElement('div'); el.className = 'l';
  el.innerHTML = '<span class="k">Tamanho da tela</span><span class="s">' + window.innerWidth + ' x ' + window.innerHeight + '</span>';
  out.appendChild(el);
  document.getElementById('ua').textContent = navigator.userAgent;
})();
</script>
</body>
</html>
